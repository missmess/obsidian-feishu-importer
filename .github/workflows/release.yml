name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and publish
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: yarn

      - name: Verify release version
        run: node -e "const version = require('./manifest.json').version; if (version !== process.env.RELEASE_TAG) { throw new Error(`Tag ${process.env.RELEASE_TAG} does not match manifest version ${version}`); }"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build plugin
        run: yarn build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/feishu-importer/main.js
            dist/feishu-importer/manifest.json
            dist/feishu-importer/styles.css

      - name: Create annotated release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="$RELEASE_TAG" \
            --generate-notes \
            --draft \
            dist/feishu-importer/main.js \
            dist/feishu-importer/manifest.json \
            dist/feishu-importer/styles.css

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="$RELEASE_TAG" \
            --generate-notes \
            dist/feishu-importer/main.js \
            dist/feishu-importer/manifest.json \
            dist/feishu-importer/styles.css
